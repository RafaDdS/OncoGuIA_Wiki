const COLUMNS = [{"title": "Título", "field": "Título", "sorter": "string", "headerFilter": "input", "width": 300}, {"title": "Autores", "field": "Autores", "sorter": "string", "headerFilter": "input", "width": 250}, {"title": "Ano", "field": "Ano", "sorter": "number", "headerFilter": "number", "width": 80}, {"title": "DOI", "field": "DOI", "sorter": "string", "headerFilter": "input", "width": 200, "formatter": "html"}, {"title": "Revista", "field": "Revista", "sorter": "string", "headerFilter": "input", "width": 200}, {"title": "Detalhes_Publicação", "field": "Detalhes_Publicação", "sorter": "string", "headerFilter": "input", "width": 180}, {"title": "Documento_Origem", "field": "Documento_Origem", "sorter": "string", "headerFilter": "input"}, {"title": "Pagina", "field": "Pagina", "sorter": "string", "headerFilter": "input"}];

const FILTER_COLS = ["Documento_Origem"];

document.addEventListener("DOMContentLoaded", function() {
  const table = new Tabulator("#table", {
    data: DATA,
    columns: COLUMNS,
    layout: "fitDataStretch",
    pagination: false,
    movableColumns: true,
    resizableRows: false,
    selectable: false,
    tooltips: true,
    headerFilterPlaceholder: "filtrar...",
    initialSort: [{"column": "Título", "dir": "asc"}],
    language: "pt-BR",
  });

  // Global search
  document.getElementById("search-input").addEventListener("input", function(e) {
    table.setFilter(matchAnyField, e.target.value);
  });

  function matchAnyField(data, filterParams, value) {
    if (!value) return true;
    const q = value.toLowerCase();
    for (let key in data) {
      if (data[key] != null && String(data[key]).toLowerCase().includes(q)) {
        return true;
      }
    }
    return false;
  }

  // Column-specific filters
  FILTER_COLS.forEach(function(col) {
    const sel = document.getElementById("filter-" + col);
    if (!sel) return;
    sel.addEventListener("change", function() {
      if (this.value) {
        table.addFilter(col, "=", this.value);
      } else {
        table.removeFilter(col, "=");
      }
    });
  });

  // Update row count on filter
  table.on("dataFiltered", function(filters, rows) {
    document.querySelector(".stats").innerHTML =
      rows.length + " registros &middot; 8 colunas";
  });
});
</script>
