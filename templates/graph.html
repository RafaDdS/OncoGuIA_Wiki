<div class="graph-section">
  <h2 class="section-title">__GRAPH_TITLE__</h2>
  __LEGEND__
  <div class="graph-wrapper">
    <div id="graph" style="width:__GRAPH_WIDTH__px;height:__GRAPH_HEIGHT__px;background:#fff;"></div>
  </div>
</div>

<script>
(function() {
  const graphNodes = new vis.DataSet(__GRAPH_NODES__);
  const graphEdges = new vis.DataSet(__GRAPH_EDGES__);
  document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("graph");
    const options = {
      physics: false,
      layout: { improvedLayout: false },
      nodes: {
        shape: "dot",
        size: 22,
        borderWidth: 2,
        font: { size: 12, face: "Tahoma", vadjust: 10 },
        shadow: { enabled: true, size: 8, x: 0, y: 0 },
      },
      edges: {
        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
        font: { size: 10, align: "middle", color: "#555", strokeWidth: 3, strokeColor: "#ffffff" },
        smooth: { type: "continuous", roundness: 0.4 },
        color: { color: "#9aa0a6", highlight: "#4051b5", hover: "#4051b5" },
      },
      interaction: { hover: true, tooltipDelay: 60, navigationButtons: true, keyboard: true },
      height: "100%",
      width: "100%",
    };
    const graph = new vis.Network(container, { nodes: graphNodes, edges: graphEdges }, options);
    graph.fit({ animation: false });
  });
})();
</script>
