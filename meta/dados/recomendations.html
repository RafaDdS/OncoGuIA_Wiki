    border-radius: 4px;

  .legend {

    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 12px;
    color: #555;

ITY", "observacoes": "Adicionar Pertuzumabe se N+", "fonte": "Adjuvante", "tipos_compativeis": "[1,2,5,15]", "id_estados": "pos_neoadj_her2_pcr"}, {"id": "108", "fase_clinica": "Adjuvância", "subtipo": "HER2+", "cenario_populacao": "Anti-HER2 — HER2+, N+ (APHINITY)", "recomendacao": "Considerar adição de Pertuzumabe", "detalhes_tratamento": "Pertuzumabe + Trastuzumabe + QT, até 1 ano", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "APHINITY", "observacoes": "Maior benefício em N+; em N0 não houve benefício clínico relevante", "fonte": "Adjuvante", "tipos_compativeis": "[1,2,5,15]", "id_estados": "adj_upfront_her2"}, {"id": "109", "fase_clinica": "Neoadjuvância", "subtipo": "RH+/HER2-", "cenario_populacao": "1ª linha — Tumores RH+/HER2- de alto risco", "recomendacao": "Administrar AC dose-dense (ACdd) seguido de Paclitaxel", "detalhes_tratamento": "ACdd: Adriamicina 60 mg/m² + Ciclofosfamida 600 mg/m² D1 a cada 2 semanas, 4 ciclos. Paclitaxel: 80 mg/m² semanal por 12 semanas OU 175 mg/m² a cada 2 semanas, 4 ciclos", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "EBCTCG meta-análise", "observacoes": "Preferir dose-dense || Esquema ACdd: Doxorrubicina 60 mg/m² + Ciclofosfamida 600 mg/m², D1, a cada 14 dias, 4 ciclos com suporte de G-CSF (Pegfilgrastim 6mg D2). Paclitaxel 80 mg/m² semanal por 12 semanas ou 175 mg/m² a cada 14 dias, 4 ciclos. Não utilizar 5-FU (sem benefício). Paclitaxel 175 mg/m² a cada 21 dias é inferior. | Toxicidade/monitoramento: QT dose-densa exige suporte profilático com G-CSF (pegfilgrastim 6 mg D2) em cada ciclo; monitorar hemograma (neutropenia febril), função cardíaca (FEVE - antraciclina) e neuropatia periférica (paclitaxel).", "fonte": "Neoadjuvante", "tipos_compativeis": "[1,2,4,5,6]", "id_estados": "neoadj_candidata_rhpos"}, {"id": "110", "fase_clinica": "Adjuvância", "subtipo": "RH+/HER2-", "cenario_populacao": "Quimioterapia — 1ª linha — RH+/HER2-, alto risco (≥2 cm e/ou LFN+)", "reco recomendacao": "Forte", "estudo_base": "NATALEE", "observacoes": "NATALEE (atualização, 5 anos): ganho de 4,5% em SLDi vs controle; benefício em todos os subgrupos predefinidos, incluindo N0 (HR 0,606; IC 95% 0,372-0,986). | Não associar a Tamoxifeno. Critérios NATALEE: N+ (qualquer) OU N0 com (T ≥ 2cm + Grau 3 OU T ≥ 2cm + Ki67 ≥ 20% + alto risco genômico) ou T3/T4. Dose é 400 mg (não 600 mg). Associar a IA + supressão ovariana (se premenopausa). | Toxicidade/monitoramento: hepatotoxicidade (AST/ALT a cada ciclo; ~10% G3-4; pausar se ALT/AST > 3x LSN com bilirrubina > 2x LSN), neutropenia (hemograma), prolongamento de QTcF (basal, C1D15, C2D1; pausar se ≥ 480 ms e corrigir eletrólitos); contraindicado com tamoxifeno.", "fonte": "Adjuvante", "tipos_compativeis": "[1,2,5,6,12]", "id_estados": "pos_neoadj_rhpos_residual,adj_upfront_rhpos"}, {"id": "116", "fase_clinica": "Neoadjuvância", "subtipo": "TNBC", "cenario_populacao": "Pós-neoadjuvância (Doença Residual) — Pacientes TNBC sem RPC após neoadjuvância", "recomendacao": "Administrar Capecitabina adjuvante", "detalhes_tratamento": "Capecitabina 2.000-2.500 mg/m² (dose reduzida para 2.000 em ocidentais) D1-14 a cada 3 semanas, 6-8 ciclos", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "CREATE-X", "observacoes": "Ganho absoluto de 8,5% em 5 anos || Dose: 2.000 mg/m² (e não 2.500 mg/m², devido à maior toxicidade em ocidentais) VO D1-14, a cada 21 dias, por 6 a 8 ciclos.", "fonte": "Neoadjuvante", "tipos_compativeis": "[1,2,5,6,12,15]", "id_estados": "pos_neoadj_tnbc_residual"}, {"id": "117", "fase_clinica": "Adjuvância", "subtipo": "HER2+", "cenario_populacao": "Anti-HER2 — HER2+, doença residual pós-neoadjuvância", "recomendacao": "Oferecer T-DM1 adjuvante", "detalhes_tratamento": "3,6 mg/kg EV D1, q3sem, 14 ciclos", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "KATHERINE", "observacoes": "Ganho de SG de 4,7% em 7 anos | KATHERINE: ganho de SG de 4,7% em 7 anos. Toxicidades a monitorar: trombocitopenia, hepatotoxicidade, neuropatia periférica e fadiga (NÃO se refere a ganho de peso).", "fonte": "Adjuvante", "tipos_compativeis": "[1,2,5,6,12,15]", "id_estados": "pos_neoadj_her2_residual"}, {"id": "118", "fase_clinica": "Neoadjuvância", "subtipo": "TNBC", "cenario_populacao": "1ª linha — Tumores > 2 cm ou linfonodos positivos (N+)", "recomendacao": "Administrar esquema Keynote-522 (Pembrolizumabe + QT)", "detalhes_tratamento": "Fase 1 (4 ciclos): Carboplatina (AUC5 D1 ou AUC1.5 D1/D8/D15) + Paclitaxel 80 mg/m² + Pembro 200 mg. Fase 2 (4 ciclos): Doxorrubicina/Epirrubicina + Ciclofosfamida + Pembro 200 mg. Fase 3 (adjuvante): Pembro 200 mg por 9 ciclos", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "KEYNOTE-522", "observacoes": "Melhora de SG: 86.6% vs 81.7% em 5 anos || Fase 2 pode ser dose-densa (a cada 14 dias com G-CSF, desvinculado do Pembro). Tumores HER2-negativos com RE entre 1-10% (ER-low) devem ser manejados conforme este fluxograma.", "fonte": "Neoadjuvante", "tipos_compativeis": "[1,2,5,6,12,15,16,21]", "id_estados": "neoadj_candidata_tnbc"}, {"id": "119", "fase_clinica": "Adjuvância", "subtipo": "RH+/HER2-", "cenario_populacao": "CDIS, RH+ (sem mastectomia bilateral)", "recomendacao": "Oferecer hormonioterapia adjuvante", "detalhes_tratamento": "Tamoxifeno 20 mg/dia por 5a (ou 10mg em dias alternados por 3a) ou Anastrozol 1mg/dia (pós-menopausa) por 5a", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "NSABP B-35/DeCensi", "observacoes": "B-35 (DCIS RH+, pós-menopausa, lumpectomia+RT): tamoxifeno 20 mg/d ×5 anos vs anastrozol 1 mg/d ×5 → anastrozol reduziu eventos de mama em pós-menopausa mais jovens; eficácia geral similar em recidiva invasiva; diferenças pequenas. | DeCensi (neoplasia intraepitelial de mama = CDIS/LIN, dose baixa): tamoxifeno 5 mg/d ×3 anos vs placebo → redução de recidiva local e contralateral proporção similar à dose-padrão, com menos toxicid  1ª linha formal: imuno se CPS>=10 ou QT/Dato-DXd.", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,5,20]", "id_estados": "meta_1l_tnbc"}, {"id": "182", "fase_clinica": "Metastático", "subtipo": "TNBC", "cenario_populacao": "1ª linha (informativo) — TNBC metastático PD-L1 positivo (candidata a imunoterapia)", "recomendacao": "Oferecer Sacituzumabe govitecana + Pembrolizumabe (NÃO aprovado no Brasil)", "detalhes_tratamento": "Sacituzumabe + Pembrolizumabe (em estudo; ASCENT-04/KEYNOTE-D19)", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "ASCENT-04 (KEYNOTE-D19)", "observacoes": "ASCENT-04 (KEYNOTE-D19): sacituzumabe + pembrolizumabe vs imuno + QT (padrão) - SLP 11,2 vs 7,8 meses (HR 0,65) em TNBC PD-L1 positivo 1ª linha. Sem aprovação regulatória no momento da diretriz; não consta no fluxograma; informativo.", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,5,16,20]", "id_estados": "meta_1l_tnbc"}, {"id": "183", "fase_clinica": "Metastático", "subtipo": "RH+/HER2-", "cenario_populacao": "1ª linha — Alternativa", "recomendacao": "Oferecer Fulvestranto + Ribociclibe (alternativa a IA + iCDK4/6 em 1ª linha)", "detalhes_tratamento": "Fulvestranto 500 mg IM D1, D15 e D29, depois 500 mg IM D1 a cada 28 dias + Ribociclibe 600 mg VO D1-D21/q28d.", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "MONALEESA-3", "observacoes": "Guarda-chuva: 1ª linha — alternativa a IA + iCDK4/6; PARSIFAL mostrou equivalência entre fulvestranto e IA quando combinados a iCDK4/6. | MONALEESA-3 (ribociclibe + fulvestranto, pós-menopausa, 1ª e 2ª linha): SG 53,7 vs 41,5 meses (HR 0,73) em 56 meses.", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,4,5,20,21]", "id_estados": "meta_1l_rhpos"}, {"id": "184", "fase_clinica": "Metastático", "subtipo": "RH+/HER2-", "cenario_populacao": "1ª linha — Alternativa", "recomendacao": "Oferecer Fulvestranto + Abemaciclibe (alternativa a IA + iCDK4/6 em 1ª linha)", "detalhes_tratamento": "Fulvestranto 500 mg IM D1, D15 e D29, depois 500 mg IM D1 a cada 28 dias + Abemaciclibe 150 mg VO 2x/dia contínuo.", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "MONARCH-2", "observacoes": "Guarda-chuva: 1ª linha — alternativa a IA + iCDK4/6; PARSIFAL mostrou equivalência entre fulvestranto e IA quando combinados a iCDK4/6. | MONARCH-2 (abemaciclibe + fulvestranto, progressão a IA): SG 46,7 vs 37,3 meses (HR 0,757; p=0,0137) em 47,7 meses.", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,4,5,20,21]", "id_estados": "meta_1l_rhpos"}, {"id": "185", "fase_clinica": "Metastático", "subtipo": "RH+/HER2-", "cenario_populacao": "1ª linha — Pós-menopausa ou sem restrição", "recomendacao": "Oferecer IA + Palbociclibe (1ª linha)", "detalhes_tratamento": "IA (Letrozol 2,5 mg/dia, Anastrozol 1 mg/dia ou Exemestano 25 mg/dia) + Palbociclibe 125 mg VO D1-D21/q28d.", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "PALOMA-2", "observacoes": "Guarda-chuva: IA + iCDK4/6 em 1ª linha (pós-menopausa ou sem restrição). | PALOMA-2: ganho de SLP (24,8 vs 14,5 meses; HR 0,58), SEM ganho de SG. | SONIA (2024): adiar o iCDK4/6 para 2ª linha não prejudica SLP2 nem SG, reduzindo exposição e toxicidade; considerar individualizar em casos indolentes/não-viscerais.", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,4,5,6,7,12,20,21]", "id_estados": "meta_1l_rhpos"}, {"id": "186", "fase_clinica": "Metastático", "subtipo": "RH+/HER2-", "cenario_populacao": "1ª linha — Pós-menopausa ou sem restrição", "recomendacao": "Oferecer IA + Ribociclibe (1ª linha)", "detalhes_tratamento": "IA (Letrozol 2,5 mg/dia, Anastrozol 1 mg/dia ou Exemestano 25 mg/dia) + Ribociclibe 600 mg VO D1-D21/q28d.", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "MONALEESA-2", "observacoes": "Guarda-chuva: IA + iCDK4/6 em 1ª linha (pós-menopausa ou sem restrição). | MONALEESA-2: SG 63,9 vs 51,4 meses (HR 0,76). | SONIA (2024): adiar o iCDK4/6 para acao": "Manutenção — HER2+/RH+ (após resposta máxima à QT)", "recomendacao": "Oferecer Trastuzumabe + Lapatinibe + Hormonioterapia (manutenção HER2+/RH+)", "detalhes_tratamento": "Trastuzumabe (ataque 8 mg/kg EV + manutenção 6 mg/kg q3sem) + Lapatinibe 1000 mg/dia VO + IA ou Tamoxifeno.", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "ALTERNATIVE", "observacoes": "Guarda-chuva: após resposta máxima à QT, anti-HER2 + HT é preferencial sobre HT isolada. | ALTERNATIVE (fase III, HER2+/RH+): T + Lapatinibe + IA vs T + IA → SLP 11,0 vs 8,3 meses (HR 0,57; p=0,0064).", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,5,20]", "id_estados": "meta_linhas_tardias"}, {"id": "190", "fase_clinica": "Metastático", "subtipo": "HER2+", "cenario_populacao": "1ª linha — Sem exposição prévia OU recidiva >6m da adjuvância", "recomendacao": "Oferecer Trastuzumabe + Pertuzumabe + Docetaxel (1ª linha)", "detalhes_tratamento": "Trastuzumabe (8 mg/kg ataque → 6 mg/kg q3sem) + Pertuzumabe (840 mg ataque → 420 mg q3sem) + Docetaxel 75-100 mg/m² q3sem por ≥6 ciclos; manter HP até progressão.", "nivel_evidencia": "Alto", "forca_recomendacao": "Forte", "estudo_base": "CLEOPATRA", "observacoes": "Guarda-chuva: padrão-ouro HP + Taxano (docetaxel); alternativa de taxano no PERUSE. | CLEOPATRA: SLP 18,5 vs 12,4 meses (HR 0,62; p<0,001) e SG 56,5 vs 40,8 meses (HR 0,68; p=0,0002); 37% vivas aos 8 anos; docetaxel ≥6 ciclos em respondedoras (redução de dose 25% conforme toxicidade; continuar QT além de 6 ciclos não aumenta SG). | ATENÇÃO: DESTINY-Breast09 (T-DXd + Pertuzumabe) superior, mas sem aprovação Anvisa para 1ª linha.", "fonte": "Metastática", "tipos_compativeis": "[1,2,3,5,6,10,12,20,21]", "id_estados": "meta_1l_her2"}, {"id": "191", "fase_clinica": "Metastático", "subtipo": "HER2+", "cenario_populacao": "1ª linha — Sem exposição prévia OU recidiva >6m da adjuvância", "recomendacao": "Oferecer Trastuzumabe + Pertuzumabe + Paclitaxel ou Nab-Paclitaxel (1ª linha)",   function matchAnyField(data, filterParams, value) {
    if (!value) return true;
    const q = value.toLowerCase();
    for (let key in data) {
      if (data[key] != null && String(data[key]).toLowerCase().includes(q)) {
        return true;

  });
